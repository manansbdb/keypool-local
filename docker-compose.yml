services:
  keypool:
    build: .
    user: "10001:10001"
    environment:
      LLM_KEYPOOL_DB: /data/keys.db
      LLM_KEYPOOL_MASTER_KEY_FILE: /data/master.key
      LLM_KEYPOOL_FREE_ONLY: "true"
      LLM_KEYPOOL_ALLOW_PAID_FALLBACK: "false"
      LLM_KEYPOOL_PROXY_TOKEN: "${LLM_KEYPOOL_PROXY_TOKEN:-changeme}"
      LLM_KEYPOOL_PROXY_REQUIRE_AUTH: "true"
    volumes:
      - keypool-data:/data
    # Loopback-only publish (do not expose to 0.0.0.0)
    ports:
      - "127.0.0.1:8000:8000"
    command: ["llm-keypool", "proxy", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  keypool-data:
